; AI Waste Segregation — ESP32-CAM (serial) firmware
; Build & flash from the firmware/ folder:
;   pio run -t upload          (board must be in bootloader mode)
;   pio device monitor         (serial monitor, 921600)
[platformio]
src_dir = esp32cam_serial
default_envs = esp32cam

[env:esp32cam]
platform        = espressif32@6.12.0
board           = esp32cam
framework       = arduino
upload_protocol = esptool
upload_speed    = 921600
monitor_speed   = 921600
; This board has PSRAM -> firmware uses QVGA + the frame2jpg() JPEG path.
; Without this flag psramFound() returns false and it falls back to QQVGA/RGB565.
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  madhephaestus/ESP32Servo @ ^3.0.0
